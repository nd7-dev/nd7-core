[package]
name = "nd7-core"
version = "0.1.0"
edition = "2024"

# Shared code lives in the library (src/lib.rs). Every binary target below
# links it; add further tools as more [[bin]] entries.
[lib]
name = "nd7_core"
path = "src/lib.rs"

[[bin]]
name = "nd7audit"
path = "src/bin/nd7audit.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
