[package]
name = "nd7-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Kernel sandbox and tamper-evident audit log for AI coding agents"
repository = "https://github.com/nd7-dev/nd7-core"
homepage = "https://nd7.dev"

# Shared code lives in the library (src/lib.rs). Every binary target below
# links it; add further tools as more [[bin]] entries.
[lib]
name = "nd7_core"
path = "src/lib.rs"

[[bin]]
name = "nd7"
path = "src/bin/nd7.rs"

[[bin]]
name = "nd7-exec"
path = "src/bin/nd7-exec.rs"

# `nd7-exec` must never take its session directory from the environment: the
# environment belongs to the caller it defends against. The override exists
# only for the tests, so it is gated at compile time rather than at run time.
[features]
test-seams = []

[[test]]
name = "nd7_exec"
required-features = ["test-seams"]

[[test]]
name = "nd7_exec_e2e"
required-features = ["test-seams"]

[dependencies]
base64 = "0.23"
blake3 = "1.8.7"
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zstd = "0.14"
